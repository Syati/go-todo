name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.8
      - name: Run lint with fixes
        run: make lint
      - name: Check for uncommitted fixes and generated code
        run: git diff --exit-code

  unit-test:
    name: Unit test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.8
        with:
          install_args: go
      - name: Run unit tests with race detector
        run: make test
